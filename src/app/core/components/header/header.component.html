<header class="navbar">
  <!-- Logo -->
  <a routerLink="/" class="logo">
    Book<span>Store</span>
  </a>

  <!-- Navigation Links -->
  <nav class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Catalogue
    </a>

    <!-- Panier -->
    <a routerLink="/cart" routerLinkActive="active" class="cart-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="21" r="1"/>
        <circle cx="19" cy="21" r="1"/>
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
      </svg>
      <span>Panier</span>
      <span class="cart-badge" *ngIf="cartService.totalCount() > 0">
        {{ cartService.totalCount() }}
      </span>
    </a>

    <!-- Utilisateur Déconnecté -->
    <ng-container *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" class="btn btn-outline btn-sm">Connexion</a>
      <a routerLink="/register" class="btn btn-primary btn-sm">Inscription</a>
    </ng-container>

    <!-- Utilisateur Connecté -->
    <div class="user-menu-container" *ngIf="authService.isLoggedIn()">
      <button type="button" class="user-avatar-btn" (click)="toggleUserMenu()">
        <div class="avatar-circle">
          {{ authService.currentUser()?.first_name?.charAt(0) || authService.currentUser()?.username?.charAt(0) || 'U' }}
        </div>
        <span class="username">
          {{ authService.currentUser()?.first_name || authService.currentUser()?.username }}
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div class="user-dropdown">
        <a routerLink="/profile" (click)="isUserMenuOpen = false">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Mon Profil
        </a>
        <a routerLink="/orders" (click)="isUserMenuOpen = false">
          Mes commandes
        </a>
        <button type="button" (click)="logout()" class="logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Déconnexion
        </button>
      </div>
    </div>
  </nav>
</header>
